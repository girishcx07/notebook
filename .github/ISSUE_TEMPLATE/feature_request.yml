name: Feature request
description: Propose a new feature or platform improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
      placeholder: Teams need...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the workflow, UX, or technical direction you want.
      placeholder: We should add...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List any workarounds or alternatives you reviewed.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, references, or architectural notes.
